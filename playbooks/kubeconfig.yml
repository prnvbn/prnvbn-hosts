---
- name: Add the Pi to the local kubeconfig
  hosts: prnvbn-pi
  gather_facts: false
  become: true

  tasks:
    - name: Read the K3s admin credentials
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_admin_config
      no_log: true

- name: Configure local access with kubectl
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    kubeconfig_path: "{{ lookup('ansible.builtin.env', 'KUBECONFIG') or (lookup('ansible.builtin.env', 'HOME') ~ '/.kube/config') }}"
    destination: "{{ kubeconfig_path | expanduser | realpath }}"
    admin_config: "{{ hostvars['prnvbn-pi'].k3s_admin_config.content | b64decode | from_yaml }}"

  tasks:
    - name: Require a single destination file
      ansible.builtin.assert:
        that:
          - kubeconfig_path | length > 0
          - "':' not in kubeconfig_path"
        fail_msg: Pass a single destination with -e kubeconfig_path=/path/to/config.

    - name: Check kubectl is installed locally
      ansible.builtin.command:
        argv: [kubectl, version, --client]
      changed_when: false

    - name: Check the kubeconfig directory
      ansible.builtin.stat:
        path: "{{ destination | dirname }}"
      register: config_directory

    - name: Create the kubeconfig directory
      ansible.builtin.file:
        path: "{{ destination | dirname }}"
        state: directory
        mode: "0700"
      when: not config_directory.stat.exists

    - name: Check for an existing kubeconfig
      ansible.builtin.stat:
        path: "{{ destination }}"
      register: existing_config

    - name: Create a private credentials directory
      ansible.builtin.tempfile:
        state: directory
        prefix: pi-credentials-
      register: credentials_dir

    - name: Update a temporary copy before saving the kubeconfig
      block:
        - name: Create a staged kubeconfig beside the destination
          ansible.builtin.tempfile:
            state: file
            path: "{{ destination | dirname }}"
            prefix: .pi-kubeconfig-
          register: staged_config

        - name: Copy the existing kubeconfig to the staged file
          ansible.builtin.copy:
            src: "{{ destination }}"
            dest: "{{ staged_config.path }}"
            mode: "0600"
          when: existing_config.stat.exists
          no_log: true

        - name: Write the certificates for kubectl to embed
          ansible.builtin.copy:
            content: "{{ item.data | b64decode }}"
            dest: "{{ credentials_dir.path }}/{{ item.name }}"
            mode: "0600"
          loop:
            - name: ca.crt
              data: "{{ admin_config.clusters[0].cluster['certificate-authority-data'] }}"
            - name: client.crt
              data: "{{ admin_config.users[0].user['client-certificate-data'] }}"
            - name: client.key
              data: "{{ admin_config.users[0].user['client-key-data'] }}"
          no_log: true

        - name: Add or refresh the Pi cluster
          ansible.builtin.command:
            argv:
              - kubectl
              - "--kubeconfig={{ staged_config.path }}"
              - config
              - set-cluster
              - prnvbn-pi
              - "--server=https://{{ hostvars['prnvbn-pi'].ansible_host }}:6443"
              - "--certificate-authority={{ credentials_dir.path }}/ca.crt"
              - --embed-certs=true
          changed_when: false

        - name: Add or refresh the Pi admin credentials
          ansible.builtin.command:
            argv:
              - kubectl
              - "--kubeconfig={{ staged_config.path }}"
              - config
              - set-credentials
              - prnvbn-pi
              - "--client-certificate={{ credentials_dir.path }}/client.crt"
              - "--client-key={{ credentials_dir.path }}/client.key"
              - --embed-certs=true
          changed_when: false
          no_log: true

        - name: Add or refresh the Pi context
          ansible.builtin.command:
            argv:
              - kubectl
              - "--kubeconfig={{ staged_config.path }}"
              - config
              - set-context
              - prnvbn-pi
              - --cluster=prnvbn-pi
              - --user=prnvbn-pi
          changed_when: false

        - name: Back up the existing kubeconfig
          ansible.builtin.copy:
            src: "{{ destination }}"
            dest: "{{ destination }}.bak"
            mode: "0600"
          when: existing_config.stat.exists
          no_log: true

        - name: Save the updated kubeconfig
          ansible.builtin.copy:
            src: "{{ staged_config.path }}"
            dest: "{{ destination }}"
            mode: "0600"
          no_log: true
      always:
        - name: Remove temporary credentials
          ansible.builtin.file:
            path: "{{ credentials_dir.path }}"
            state: absent

        - name: Remove the staged kubeconfig
          ansible.builtin.file:
            path: "{{ staged_config.path }}"
            state: absent
          when: staged_config.path is defined

    - name: Show how to access the Pi
      ansible.builtin.debug:
        msg: "kubectl --kubeconfig {{ destination | quote }} --context prnvbn-pi get nodes"
